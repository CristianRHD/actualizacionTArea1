<div>
  <h2>Calculadora de IMC</h2>
  <form (ngSubmit)="calcularIMC()">
    <label for="peso">Peso (kg):</label>
    <input type="number" id="peso" [(ngModel)]="peso" name="peso" required>

    <label for="altura">Altura (m):</label>
    <input type="number" step="0.01" id="altura" [(ngModel)]="altura" name="altura" required>

    <button type="submit">Calcular IMC</button>
  </form>

  <div *ngIf="IMC !== null">
    <p>IMC: {{ IMC }}</p>
    <p>TU Peso corporar es : {{ estadoIMC }}
      <img *ngIf="emojiUrl" [src]="emojiUrl" alt="Emoji" width="50">
    </p>
  </div>
</div>
